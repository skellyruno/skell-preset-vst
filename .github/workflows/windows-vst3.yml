name: Skell-Preset | Windows VST3

on:
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'SkellCore/**'
      - 'tests/**'
      - 'tools/**'
      - 'assets/**'
      - '.github/workflows/windows-vst3.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure portable DSP/MATCH tests
        run: cmake -S . -B build-test -DSKELL_PRESET_PORTABLE_ONLY=ON
      - name: Compile portable tests
        run: cmake --build build-test --parallel 2
      - name: Run portable regression suite
        run: ctest --test-dir build-test --output-on-failure

  windows-vst3:
    runs-on: windows-latest
    needs: portable-tests
    steps:
      - uses: actions/checkout@v4
      - name: Configure JUCE 8 and SkellCore
        run: cmake -S . -B build -A x64
      - name: Compile VST3 and Standalone
        run: cmake --build build --config Release --parallel 2
      - name: Bundle VST3
        shell: pwsh
        run: |
          $vst = Get-ChildItem -Path build -Directory -Recurse -Filter '*.vst3' | Select-Object -First 1
          if (-not $vst) { throw 'Skell-Preset VST3 bundle missing' }
          Compress-Archive -LiteralPath $vst.FullName -DestinationPath Skell-Preset-Windows-VST3.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Skell-Preset-Windows-VST3
          path: Skell-Preset-Windows-VST3.zip
          if-no-files-found: error
          retention-days: 30
