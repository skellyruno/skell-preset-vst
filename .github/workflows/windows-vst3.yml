name: Skell-Preset | Windows VST3

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'SkellCore/**'
      - 'tests/**'
      - 'tools/**'
      - 'assets/**'
      - '.github/workflows/windows-vst3.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure portable DSP/MATCH tests
        run: cmake -S . -B build-test -DSKELL_PRESET_PORTABLE_ONLY=ON
      - name: Compile portable tests
        run: cmake --build build-test --parallel 2
      - name: Run portable regression suite
        run: ctest --test-dir build-test --output-on-failure
      - name: Test offline reference WAV diagnostics
        run: python3 -m unittest discover -s tests -p test_reference_wav_inspect.py -v

  windows-vst3:
    runs-on: windows-latest
    needs: portable-tests
    steps:
      - uses: actions/checkout@v5
      - name: Configure JUCE 8 and SkellCore
        run: cmake -S . -B build -A x64
      - name: Compile Windows VST3 and regression fixtures
        run: cmake --build build --config Release --parallel 2
      # JUCE emits permissive moduleinfo JSON with trailing commas. Normalize
      # only the shipping plugin, then fail closed on identity and class IDs.
      - name: Normalize and validate shipping VST3 metadata as strict JSON
        shell: pwsh
        run: |
          $vst = Get-ChildItem -Path build -Directory -Recurse -Filter 'Skell-Preset.vst3' | Select-Object -First 1
          if (-not $vst) { throw 'Shipping Skell-Preset VST3 bundle missing' }
          $moduleinfo = Join-Path $vst.FullName 'Contents/Resources/moduleinfo.json'
          if (-not (Test-Path -LiteralPath $moduleinfo -PathType Leaf)) { throw 'Shipping VST3 moduleinfo.json missing' }
          & python tools/normalize_vst3_moduleinfo.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'VST3 metadata normalizer self-test failed' }
          & python tools/normalize_vst3_moduleinfo.py $moduleinfo --expected-name 'Skell-Preset' --expected-vendor 'Skell Audio' --expected-version '0.6.0'
          if ($LASTEXITCODE -ne 0) { throw 'VST3 metadata normalization failed' }
          $manifest = Get-Content -LiteralPath $moduleinfo -Raw | ConvertFrom-Json -ErrorAction Stop
          if ($manifest.Name -ne 'Skell-Preset' -or $manifest.Version -ne '0.6.0' -or $manifest.'Factory Info'.Vendor -ne 'Skell Audio') {
            throw 'Unexpected Skell-Preset identity or version in VST3 moduleinfo'
          }
          if (@($manifest.Classes).Count -ne 2) { throw 'Expected exactly two VST3 classes' }
          $ids = @($manifest.Classes | ForEach-Object { $_.CID })
          if (($ids | Select-Object -Unique).Count -ne 2) { throw 'Duplicate VST3 class IDs' }
      - name: Validate native preset ZIP import/export and security
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Prove external VST3 load and audio with owned test fixture
        shell: pwsh
        run: |
          $fixture = Get-ChildItem build -Recurse -Directory -Filter 'SkellHostFixture.vst3' | Select-Object -First 1
          $runner = Get-ChildItem build -Recurse -File -Filter 'SkellPresetHostProbe.exe' | Select-Object -First 1
          if (-not $fixture -or -not $runner) { throw 'Nested host fixture or probe executable missing' }
          & $runner.FullName $fixture.FullName
          if ($LASTEXITCODE -ne 0) { throw "Nested VST3 host regression failed: $LASTEXITCODE" }
      - name: Stage single-extraction VST3 package
        shell: pwsh
        run: |
          # Keep the installable bundle at the artifact root. Uploading a ZIP
          # inside an Actions artifact ZIP previously required two extractions.
          $vst = Get-ChildItem -Path build -Directory -Recurse -Filter 'Skell-Preset.vst3' | Select-Object -First 1
          if (-not $vst -or $vst.Name -ne 'Skell-Preset.vst3') { throw 'Skell-Preset VST3 bundle missing' }
          $package = Join-Path $env:GITHUB_WORKSPACE 'package'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item -LiteralPath $vst.FullName -Destination $package -Recurse
          $binary = Get-ChildItem -LiteralPath (Join-Path $package 'Skell-Preset.vst3') -Recurse -File -Filter 'Skell-Preset.vst3' | Select-Object -First 1
          if (-not $binary) { throw 'Shipping VST3 binary missing after staging' }
          $stagedModuleInfo = Join-Path $package 'Skell-Preset.vst3/Contents/Resources/moduleinfo.json'
          if (-not (Test-Path -LiteralPath $stagedModuleInfo -PathType Leaf)) { throw 'Staged moduleinfo.json missing' }
          $binaryHash = (Get-FileHash -LiteralPath $binary.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $moduleInfoHash = (Get-FileHash -LiteralPath $stagedModuleInfo -Algorithm SHA256).Hash.ToLowerInvariant()
          $branch = if ($env:GITHUB_HEAD_REF) { $env:GITHUB_HEAD_REF } else { $env:GITHUB_REF_NAME }
          $relativeBinary = $binary.FullName.Substring((Join-Path $package 'Skell-Preset.vst3').Length + 1)
          @(
            'Product: Skell-Preset'
            'Version: 0.6.0'
            "Source branch: $branch"
            "Workflow checkout commit: $env:GITHUB_SHA"
            "PR head commit: ${{ github.event.pull_request.head.sha || github.sha }}"
            "Workflow run: $env:GITHUB_RUN_ID"
            'Bundle: Skell-Preset.vst3'
            "Binary path: $relativeBinary"
            "Binary SHA256: $binaryHash"
            "moduleinfo.json SHA256: $moduleInfoHash"
            'Installed-copy identity: not verified; host fixture validates the build artifact only'
          ) | Set-Content -LiteralPath (Join-Path $package 'BUILD-INFO.txt') -Encoding utf8
          $hashLines = Get-ChildItem -LiteralPath (Join-Path $package 'Skell-Preset.vst3') -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = [System.IO.Path]::GetRelativePath($package, $_.FullName).Replace('\','/')
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $relative"
          }
          $manifestPath = Join-Path $package 'SHA256SUMS.txt'
          $hashLines | Set-Content -LiteralPath $manifestPath -Encoding utf8
          foreach ($line in Get-Content -LiteralPath $manifestPath) {
            $parts = $line -split '  ', 2
            if ($parts.Count -ne 2) { throw "Malformed SHA256 manifest line: $line" }
            $manifestFile = Join-Path $package $parts[1].Replace('/','\')
            if (-not (Test-Path -LiteralPath $manifestFile -PathType Leaf)) { throw "SHA256 manifest path missing: $($parts[1])" }
            $actualHash = (Get-FileHash -LiteralPath $manifestFile -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $parts[0]) { throw "SHA256 manifest mismatch: $($parts[1])" }
          }
      - name: Validate exact staged VST3 with pluginval
        uses: Tracktion/pluginval/validate@v2.0.0-beta3
        with:
          plugins: package/Skell-Preset.vst3
          strictness-level: 5
          pluginval-version: v2.0.0-beta3
      - uses: actions/upload-artifact@v5
        with:
          name: Skell-Preset-Windows-VST3
          path: package/*
          if-no-files-found: error
          retention-days: 30
