name: Skell-Preset | Windows VST3

# On this PR, a newer commit supersedes earlier heavy builds for this workflow.
# Never cancel main or manual release builds, and never cancel other workflows.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'SkellCore/**'
      - 'tests/**'
      - 'tools/**'
      - 'assets/**'
      - '.github/workflows/windows-vst3.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure portable DSP/MATCH tests
        run: cmake -S . -B build-test -DSKELL_PRESET_PORTABLE_ONLY=ON
      - name: Compile portable tests
        run: cmake --build build-test --parallel 2
      - name: Run portable regression suite
        run: ctest --test-dir build-test --output-on-failure
      - name: Report 20-instance CPU stress timing (hosted runner, informational)
        run: ctest --test-dir build-test -R '^SkellPresetSkelldizerStress      - name: Test offline reference WAV diagnostics
        run: python3 -m unittest discover -s tests -p test_reference_wav_inspect.py -v

  windows-vst3:
    runs-on: windows-latest
    needs: portable-tests
    steps:
      - uses: actions/checkout@v5
      - name: Configure JUCE 8 and SkellCore
        run: cmake -S . -B build -A x64 -DSKELL_PRESET_ALCHEMIST_RENDERER=ON
      - name: Compile Windows VST3 and regression fixtures
        run: cmake --build build --config Release --parallel 2
      - name: Validate native preset ZIP import/export and security
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Prove external VST3 load and audio with owned test fixture
        shell: pwsh
        run: |
          $fixture = Get-ChildItem build -Recurse -Directory -Filter 'SkellHostFixture.vst3' | Select-Object -First 1
          $runner = Get-ChildItem build -Recurse -File -Filter 'SkellPresetHostProbe.exe' | Select-Object -First 1
          if (-not $fixture -or -not $runner) { throw 'Nested host fixture or probe executable missing' }
          & $runner.FullName $fixture.FullName
          if ($LASTEXITCODE -ne 0) { throw "Nested VST3 host regression failed: $LASTEXITCODE" }
      - name: Bundle VST3
        shell: pwsh
        run: |
          # Do not accidentally package the SkellHostFixture.vst3 regression
          # plugin now present in the same build tree.
          $vst = Get-ChildItem -Path build -Directory -Recurse -Filter 'Skell-Preset.vst3' | Select-Object -First 1
          if (-not $vst -or $vst.Name -ne 'Skell-Preset.vst3') { throw 'Skell-Preset VST3 bundle missing' }
          Compress-Archive -LiteralPath $vst.FullName -DestinationPath Skell-Preset-Windows-VST3.zip -Force
      - name: Package compiled Alchemist diagnostic renderer
        shell: pwsh
        run: |
          $renderer = Get-ChildItem build -Recurse -File -Filter 'SkellPresetAlchemistRender.exe' | Select-Object -First 1
          if (-not $renderer) { throw 'Native Alchemist diagnostic renderer missing' }
          Compress-Archive -LiteralPath $renderer.FullName -DestinationPath Skell-Preset-Alchemist-Renderer.zip -Force
      - uses: actions/upload-artifact@v5
        with:
          name: Skell-Preset-Alchemist-Renderer-Windows
          path: Skell-Preset-Alchemist-Renderer.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v5
        with:
          name: Skell-Preset-Windows-VST3
          path: Skell-Preset-Windows-VST3.zip
          if-no-files-found: error
          retention-days: 30
