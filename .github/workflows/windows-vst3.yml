name: Skell-Preset | Windows VST3

# On this PR, a newer commit supersedes earlier heavy builds for this workflow.
# Never cancel main or manual release builds, and never cancel other workflows.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'SkellCore/**'
      - 'tests/**'
      - 'tools/**'
      - 'assets/**'
      - '.github/workflows/windows-vst3.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure portable DSP/MATCH tests
        run: cmake -S . -B build-test -DSKELL_PRESET_PORTABLE_ONLY=ON
      - name: Compile portable tests
        run: cmake --build build-test --parallel 2
      - name: Run portable regression suite
        run: ctest --test-dir build-test --output-on-failure
      - name: Print Studio Delay CPU and 8/16-instance memory diagnostics
        run: ctest --test-dir build-test --verbose -R SkellPresetStudioDelayTest
      - name: Test offline reference WAV diagnostics
        run: python3 -m unittest discover -s tests -p test_reference_wav_inspect.py -v

  windows-vst3:
    runs-on: windows-latest
    needs: portable-tests
    steps:
      - uses: actions/checkout@v5
      # Cache only external immutable FetchContent sources/build helpers, not
      # the full plugin build tree. CMake still revalidates its pinned refs.
      - name: Restore JUCE and pinned SkellCore FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: skellpreset-windows-fetchcontent-${{ hashFiles('CMakeLists.txt', 'SkellCore/CMakeLists.txt') }}
          restore-keys: |
            skellpreset-windows-fetchcontent-
      - name: Configure JUCE 8 and SkellCore
        run: cmake -S . -B build -A x64 -DSKELL_PRESET_ALCHEMIST_RENDERER=ON -DSKELL_PRESET_BUILD_UI_RENDERER=ON
      # Build the user-testable VST3 before unrelated heavy JUCE renderer,
      # nested-host and package-test executables. Production checks still run.
      - name: Compile shipping Windows VST3 first
        run: cmake --build build --config Release --target SkellPreset_VST3 --parallel 3
      # JUCE's manifest writer emits permissive JSON with trailing commas.
      # The VST3 bundle is user-installable only after strict normalization;
      # verify the exact shipping plugin (not SkellHostFixture.vst3).
      - name: Normalize and validate shipping VST3 metadata as strict JSON
        shell: pwsh
        run: |
          $vst = Get-ChildItem -Path build -Directory -Recurse -Filter 'Skell-Preset.vst3' | Select-Object -First 1
          if (-not $vst) { throw 'Shipping Skell-Preset VST3 bundle missing' }
          $moduleinfo = Join-Path $vst.FullName 'Contents/Resources/moduleinfo.json'
          if (-not (Test-Path -LiteralPath $moduleinfo -PathType Leaf)) { throw 'Shipping VST3 moduleinfo.json missing' }
          & python tools/normalize_vst3_moduleinfo.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'VST3 metadata normalizer self-test failed' }
          & python tools/normalize_vst3_moduleinfo.py $moduleinfo
          if ($LASTEXITCODE -ne 0) { throw 'VST3 metadata normalization failed' }
          $manifest = Get-Content -LiteralPath $moduleinfo -Raw | ConvertFrom-Json -ErrorAction Stop
          if ($manifest.Name -ne 'Skell-Preset' -or $manifest.Version -ne '0.7.0') {
            throw 'Unexpected Skell-Preset identity or version in VST3 moduleinfo'
          }
      # This is a PREVIEW binary only: compiler + metadata checked, not yet
      # native host/UI/FL Studio/pluginval approved. Final artifact is later.
      - name: Bundle VST3
        shell: pwsh
        run: |
          # Do not accidentally package the SkellHostFixture.vst3 regression
          # plugin now present in the same build tree.
          $vst = Get-ChildItem -Path build -Directory -Recurse -Filter 'Skell-Preset.vst3' | Select-Object -First 1
          if (-not $vst -or $vst.Name -ne 'Skell-Preset.vst3') { throw 'Skell-Preset VST3 bundle missing' }
          # Revalidate the exact VST3 that will be packaged.
          $metadata = Join-Path $vst.FullName 'Contents/Resources/moduleinfo.json'
          $validated = Get-Content -LiteralPath $metadata -Raw | ConvertFrom-Json -ErrorAction Stop
          if ($validated.Name -ne 'Skell-Preset' -or $validated.Version -ne '0.7.0') { throw 'Shipping VST3 metadata identity/version mismatch' }
          # Embed provenance so a downloaded ZIP can be matched to its source.
          $bin = Get-ChildItem -LiteralPath $vst.FullName -Recurse -File -Filter 'Skell-Preset.vst3' | Select-Object -First 1
          if (-not $bin) { throw 'Skell-Preset binary missing inside VST3 bundle' }
          $hash = (Get-FileHash -LiteralPath $bin.FullName -Algorithm SHA256).Hash
          $info = @(
            'Product: Skell-Preset',
            'Version: 0.7.0',
            "PR Source Commit: ${{ github.event.pull_request.head.sha || github.sha }}",
            "CI Checkout Commit: ${{ github.sha }}",
            "Branch: ${{ github.head_ref || github.ref_name }}",
            "Workflow Run: ${{ github.run_id }}",
            "Binary SHA256: $hash",
            'Bundle: Skell-Preset.vst3',
            'PREVIEW ONLY until all exact-head native/UI/FL Studio/pluginval gates pass',
            'Unverified installed-copy identity: check DAW plugin path separately'
          )
          $info | Set-Content -LiteralPath Skell-Preset-BUILD-INFO.txt -Encoding UTF8
          # upload-artifact creates the downloadable ZIP itself. Stage the
          # bundle directly so users do not receive a ZIP-inside-a-ZIP.
          $packageRoot = Join-Path $PWD 'Skell-Preset-Windows-VST3'
          if (Test-Path -LiteralPath $packageRoot) { Remove-Item -LiteralPath $packageRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $packageRoot | Out-Null
          Copy-Item -LiteralPath $vst.FullName -Destination $packageRoot -Recurse -Force
          Copy-Item -LiteralPath 'Skell-Preset-BUILD-INFO.txt' -Destination $packageRoot -Force
      - name: Verify packaged Windows VST3 identity without executing it
        shell: pwsh
        run: |
          # Run the verifier as a child process so its exit code cannot
          # terminate this Actions step. Exit 3 is intentionally expected for
          # the negative test; explicitly return success ONLY after both checks.
          $verifier = (Resolve-Path ./tools/verify-installed-skell-preset.ps1).Path
          $shell = (Get-Process -Id $PID).Path
          & $shell -NoProfile -File $verifier -Root ./Skell-Preset-Windows-VST3 -BuildInfo ./Skell-Preset-BUILD-INFO.txt
          $matchExit = $LASTEXITCODE
          if ($matchExit -ne 0) { throw "Exact-binary packaged VST3 verification failed: $matchExit" }
          & $shell -NoProfile -File $verifier -Root ./Skell-Preset-Windows-VST3 -ExpectedSha256 ('0' * 64)
          $mismatchExit = $LASTEXITCODE
          if ($mismatchExit -ne 3) { throw "Hash mismatch detection regression failed: $mismatchExit" }
          Write-Host 'PASS: exact build matched (0), deliberately wrong hash rejected (3)'
          exit 0
      - name: Upload early Windows VST3 test preview
        uses: actions/upload-artifact@v5
        with:
          name: Skell-Preset-Windows-VST3-PREVIEW
          path: Skell-Preset-Windows-VST3/**
          if-no-files-found: error
          retention-days: 14
      - name: Compile remaining native regression fixtures and real UI renderer
        run: cmake --build build --config Release --parallel 3
      - name: Validate native preset ZIP import/export and security
        run: ctest --test-dir build -C Release --output-on-failure -E SkellPresetRealRackStress
      - name: Stress compiled full rack and print CPU/latency metrics
        run: ctest --test-dir build -C Release --verbose -R SkellPresetRealRackStress
      - name: Prove external VST3 load and audio with owned test fixture
        shell: pwsh
        run: |
          $fixture = Get-ChildItem build -Recurse -Directory -Filter 'SkellHostFixture.vst3' | Select-Object -First 1
          $runner = Get-ChildItem build -Recurse -File -Filter 'SkellPresetHostProbe.exe' | Select-Object -First 1
          if (-not $fixture -or -not $runner) { throw 'Nested host fixture or probe executable missing' }
          & $runner.FullName $fixture.FullName
          if ($LASTEXITCODE -ne 0) { throw "Nested VST3 host regression failed: $LASTEXITCODE" }
          $renderer = Get-ChildItem build -Recurse -File -Filter 'SkellPresetAlchemistRender.exe' | Select-Object -First 1
          if (-not $renderer) { throw 'Real-editor VST3 host smoke executable missing' }
          & $renderer.FullName --ui-external-host-smoke $fixture.FullName
          if ($LASTEXITCODE -ne 0) { throw "External VST3 UI loader regression failed: $LASTEXITCODE" }
          $diagnostic = Get-ChildItem build -Recurse -File -Filter 'SkellPluginDiagnostic.exe' | Select-Object -First 1
          if (-not $diagnostic) { throw 'Isolated external plugin diagnostic executable missing' }
          & $diagnostic.FullName --self-test
          if ($LASTEXITCODE -ne 0) { throw "File-only native FL discovery failed: $LASTEXITCODE" }
          & $diagnostic.FullName --vst3 $fixture.FullName
          if ($LASTEXITCODE -ne 0) { throw "Separate-process VST3 probe failed: $LASTEXITCODE" }
      - name: Exercise Studio rack effects and native factory recall/audio/PDC/state
        shell: pwsh
        run: |
          $renderer = Get-ChildItem build -Recurse -File -Filter 'SkellPresetAlchemistRender.exe' | Select-Object -First 1
          if (-not $renderer) { throw 'Compiled rack audio test executable missing' }
          & $renderer.FullName --studio-smoke
          if ($LASTEXITCODE -ne 0) { throw "Studio rack audio/PDC/state regression failed: $LASTEXITCODE" }
          & $renderer.FullName --ui-smoke
          if ($LASTEXITCODE -ne 0) { throw "Real JUCE editor layout/interaction smoke failed: $LASTEXITCODE" }
          & $renderer.FullName --native-trials-smoke
          if ($LASTEXITCODE -ne 0) { throw "Native factory recall/audio/PDC/state regression failed: $LASTEXITCODE" }
          & $renderer.FullName --lowend-override-smoke
          if ($LASTEXITCODE -ne 0) { throw "Factory 54 low-end override regression failed: $LASTEXITCODE" }
      - name: Package isolated external-plugin diagnostic
        shell: pwsh
        run: |
          $diagnostic = Get-ChildItem build -Recurse -File -Filter 'SkellPluginDiagnostic.exe' | Select-Object -First 1
          if (-not $diagnostic) { throw 'Plugin diagnostic executable missing' }
          $dest = Join-Path $PWD 'Skell-Plugin-Diagnostic-Windows'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -LiteralPath $diagnostic.FullName -Destination $dest -Force
          Copy-Item -LiteralPath tools/diagnose-external-plugin.ps1 -Destination $dest -Force
          Copy-Item -LiteralPath tools/verify-installed-skell-preset.ps1 -Destination $dest -Force
      - uses: actions/upload-artifact@v5
        with:
          name: Skell-Plugin-Diagnostic-Windows
          path: Skell-Plugin-Diagnostic-Windows/**
          if-no-files-found: error
          retention-days: 14
      - name: Package compiled Alchemist diagnostic renderer
        shell: pwsh
        run: |
          $renderer = Get-ChildItem build -Recurse -File -Filter 'SkellPresetAlchemistRender.exe' | Select-Object -First 1
          if (-not $renderer) { throw 'Native Alchemist diagnostic renderer missing' }
          # Keep the executable as a direct artifact entry; upload-artifact
          # supplies the outer ZIP and no second archive is needed.
          $rendererRoot = Join-Path $PWD 'Skell-Preset-Alchemist-Renderer'
          if (Test-Path -LiteralPath $rendererRoot) { Remove-Item -LiteralPath $rendererRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $rendererRoot | Out-Null
          Copy-Item -LiteralPath $renderer.FullName -Destination $rendererRoot -Force
      - uses: actions/upload-artifact@v5
        with:
          name: Skell-Preset-Alchemist-Renderer-Windows
          path: Skell-Preset-Alchemist-Renderer/**
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v5
        with:
          name: Skell-Preset-Windows-VST3
          path: Skell-Preset-Windows-VST3/**
          if-no-files-found: error
          retention-days: 30

  alchemist-reference-ab:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'test/alchemist-reference-ab-')
    needs: windows-vst3
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Checkout owner-approved sound reference archive
        uses: actions/checkout@v5
        with:
          repository: skellyruno/skell-sound-match
          ref: feature/deuce-v25-listening-approved-20261115
          path: soundmatch
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: soundmatch/pyproject.toml
      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e soundmatch
      - name: Verify and restore owner-approved archive
        shell: pwsh
        run: |
          python soundmatch/scripts/materialize_archive.py --verify --repo-root soundmatch
          if ($LASTEXITCODE -ne 0) { throw 'Owner archive verification failed' }
          python soundmatch/scripts/materialize_archive.py --restore --repo-root soundmatch --output soundmatch/local_sound_archive
          if ($LASTEXITCODE -ne 0) { throw 'Owner archive restoration failed' }
      - name: Run Alchemist A/B tooling regressions
        run: |
          python -m unittest discover -s tests -p test_alchemist_reference_ab.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_alchemist_lowend_sweep.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@v5
        with:
          name: Skell-Preset-Alchemist-Renderer-Windows
          path: renderer
      - name: Prepare exact archived input as float WAV
        shell: pwsh
        run: |
          python tools/alchemist_reference_ab.py prepare --input-flac soundmatch/local_sound_archive/data/alchemist/audio/input_rec_printed.flac --output-wav build/alchemist-input.wav
          if ($LASTEXITCODE -ne 0) { throw 'Alchemist input conversion failed' }
      - name: Render factory 43, 45, 47, 48, 49, 50, 51, 52, 53 and 54 on the identical full input
        shell: pwsh
        run: |
          $renderer = Get-ChildItem renderer -Recurse -File -Filter 'SkellPresetAlchemistRender.exe' | Select-Object -First 1
          if (-not $renderer) { throw 'Downloaded native Alchemist renderer missing' }
          foreach ($factory in @(43,45,47,48,49,50,51,52,53,54)) {
            $output = "build/alchemist-factory-$factory.wav"
            & $renderer.FullName --factory $factory build/alchemist-input.wav $output
            if ($LASTEXITCODE -ne 0) { throw "Native factory $factory render failed: $LASTEXITCODE" }
          }
          $variants = @(
            @{ Id = 'hpf20'; Hpf = '0.0'; Band = '0.5' },
            @{ Id = 'hpf20-70minus1'; Hpf = '0.0'; Band = '0.4666667' },
            @{ Id = 'hpf20-70minus2'; Hpf = '0.0'; Band = '0.4333333' }
          )
          foreach ($variant in $variants) {
            $output = "build/alchemist-$($variant.Id).wav"
            & $renderer.FullName --factory-override 54 $variant.Hpf $variant.Band build/alchemist-input.wav $output
            if ($LASTEXITCODE -ne 0) { throw "Alchemist low-end override $($variant.Id) failed: $LASTEXITCODE" }
          }
      - name: Align measured delays, compare 19–34 s, and package 24-bit FLAC audition
        shell: pwsh
        run: |
          $renderer = Get-ChildItem renderer -Recurse -File -Filter 'SkellPresetAlchemistRender.exe' | Select-Object -First 1
          if (-not $renderer) { throw 'Downloaded native Alchemist renderer missing for provenance' }
          $archiveCommit = (git -C soundmatch rev-parse HEAD).Trim()
          $analysisArgs = @(
            "tools/alchemist_reference_ab.py", "analyze",
            "--input-flac", "soundmatch/local_sound_archive/data/alchemist/audio/input_rec_printed.flac",
            "--reference-flac", "soundmatch/local_sound_archive/data/alchemist/audio/main_effects.flac",
            "--factory43", "build/alchemist-factory-43.wav",
            "--factory45", "build/alchemist-factory-45.wav",
            "--factory47", "build/alchemist-factory-47.wav",
            "--factory48", "build/alchemist-factory-48.wav",
            "--factory49", "build/alchemist-factory-49.wav",
            "--factory50", "build/alchemist-factory-50.wav",
            "--factory51", "build/alchemist-factory-51.wav",
            "--factory52", "build/alchemist-factory-52.wav",
            "--factory53", "build/alchemist-factory-53.wav",
            "--factory54", "build/alchemist-factory-54.wav",
            "--renderer", $renderer.FullName,
            "--fst", "soundmatch/local_sound_archive/data/alchemist/presets/MAIN.fst",
            "--fst-report", "soundmatch/local_sound_archive/data/alchemist/research_reports/MAIN_FST_Structure.json",
            "--fst-chain-manifest", "tests/fixtures/alchemist_main_fst_chain.json",
            "--manifest", "soundmatch/archive/manifest.json",
            "--archive-root", "soundmatch/local_sound_archive",
            "--out-dir", "build/alchemist-reference-ab",
            "--plugin-commit", $env:GITHUB_SHA,
            "--archive-commit", $archiveCommit,
            "--archive-branch", "feature/deuce-v25-listening-approved-20261115"
          )
          python @analysisArgs
          if ($LASTEXITCODE -ne 0) { throw "Alchemist same-take analysis failed: $LASTEXITCODE" }
      - name: Analyze and package Factory 54 low-end sweep
        shell: pwsh
        run: |
          $renderer = Get-ChildItem renderer -Recurse -File -Filter 'SkellPresetAlchemistRender.exe' | Select-Object -First 1
          if (-not $renderer) { throw 'Native Alchemist renderer missing for low-end sweep' }
          $archiveCommit = (git -C soundmatch rev-parse HEAD).Trim()
          $sweepArgs = @(
            "tools/alchemist_lowend_sweep.py",
            "--input-flac", "soundmatch/local_sound_archive/data/alchemist/audio/input_rec_printed.flac",
            "--reference-flac", "soundmatch/local_sound_archive/data/alchemist/audio/main_effects.flac",
            "--factory54", "build/alchemist-factory-54.wav",
            "--hpf20", "build/alchemist-hpf20.wav",
            "--hpf20-70minus1", "build/alchemist-hpf20-70minus1.wav",
            "--hpf20-70minus2", "build/alchemist-hpf20-70minus2.wav",
            "--renderer", $renderer.FullName,
            "--fst", "soundmatch/local_sound_archive/data/alchemist/presets/MAIN.fst",
            "--fst-report", "soundmatch/local_sound_archive/data/alchemist/research_reports/MAIN_FST_Structure.json",
            "--fst-chain-manifest", "tests/fixtures/alchemist_main_fst_chain.json",
            "--manifest", "soundmatch/archive/manifest.json",
            "--archive-root", "soundmatch/local_sound_archive",
            "--out-dir", "build/alchemist-lowend-sweep",
            "--plugin-commit", $env:GITHUB_SHA,
            "--archive-commit", $archiveCommit,
            "--archive-branch", "feature/deuce-v25-listening-approved-20261115"
          )
          python @sweepArgs
          if ($LASTEXITCODE -ne 0) { throw "Alchemist low-end sweep failed: $LASTEXITCODE" }
      - uses: actions/upload-artifact@v5
        with:
          name: Alchemist-LowEnd-Sweep
          path: build/alchemist-lowend-sweep.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v5
        with:
          name: Alchemist-Native-SameTake-AB
          path: build/alchemist-reference-ab.zip
          if-no-files-found: error
          retention-days: 30
