name: Build SkellCore VST Template (Windows VST3)

# On this PR, a newer commit supersedes earlier heavy builds for this workflow.
# Never cancel main or manual release builds, and never cancel other workflows.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'SkellCore/**'
      - 'CMakeLists.txt'
      - 'Source/PluginEditor.cpp'
      - 'Source/PluginProcessor.cpp'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Package
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Directory -Recurse -Filter '*.vst3' | Select-Object -First 1
          if (-not $plugin) { throw 'VST3 bundle missing' }
          Compress-Archive -Path $plugin.FullName -DestinationPath SkellCore-Template-Windows-VST3.zip
      - uses: actions/upload-artifact@v5
        with:
          retention-days: 1
          name: SkellCore-Template-Windows-VST3
          path: SkellCore-Template-Windows-VST3.zip
          if-no-files-found: error
