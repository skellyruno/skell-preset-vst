name: Skell-Preset / Headless JUCE UI screenshots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-screenshots.yml'
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'assets/**'
      - 'tests/ui_renderer.cpp'
      - 'SkellCore/include/SkellCore/HeadlessUIRenderer.h'
      - 'SkellCore/CMakeLists.txt'
  pull_request:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux JUCE and virtual-display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build xvfb xauth pkg-config libasound2-dev libjack-jackd2-dev \
            libfreetype6-dev libfontconfig1-dev libx11-dev libxext-dev \
            libxinerama-dev libxcursor-dev libxrandr-dev libxcomposite-dev \
            libxrender-dev libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libgtk-3-dev
      - name: Configure actual-editor renderer with pinned JUCE and SkellCore
        run: |
          cmake -S . -B build-ui -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSKELL_PRESET_BUILD_UI_RENDERER=ON \
            -DSKELL_PRESET_PACKAGE_TESTS=OFF
      - name: Compile actual JUCE editor and renderer
        run: cmake --build build-ui --target SkellPresetUIRenderer --parallel 2
      - name: Capture and validate real editor PNGs
        shell: bash
        run: |
          set -euo pipefail
          renderer=$(find build-ui -type f -name SkellPresetUIRenderer -executable | head -n 1)
          test -n "$renderer"
          xvfb-run -a -s '-screen 0 1920x1080x24' "$renderer" --output ui-screenshots
          test "$(find ui-screenshots -name '*.png' | wc -l)" -eq 74
      - name: Upload PNG screenshots and contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Skell-Preset-UI-Screenshots
          path: ui-screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
