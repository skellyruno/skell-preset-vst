name: Skell Preset Quick4 renderer build only
on:
  push:
    branches: [ci/skell-preset-quick4-20261115, feat/skell-preset-rack-polish-20261115]
  pull_request:
    branches: [ci/skell-preset-quick4-20261115, test/alchemist-original-factory-recall-20261116, feat/alchemist-peak-guard-trial-20261116, fix/alchemist-tone-match-gain-units-20261116, feat/alchemist-lighter-dynamics-trial-20261116, dsp/alchemist-independent-compressor-blends-final-20261117]
permissions:
  contents: read
concurrency:
  group: quick4-renderer-only-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-renderer:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install native JUCE compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxext-dev libxinerama-dev libxcursor-dev libxrandr-dev libxcomposite-dev libxrender-dev libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev libgtk-3-dev
      - name: Configure Quick4 JUCE UI and native audio renderer
        run: cmake -S . -B build-ui -G Ninja -DCMAKE_BUILD_TYPE=Release -DSKELL_PRESET_BUILD_UI_RENDERER=ON -DSKELL_PRESET_ALCHEMIST_RENDERER=ON -DSKELL_PRESET_PACKAGE_TESTS=OFF -DSKELL_PRESET_HOST_TESTS=OFF
      - name: Compile real UI renderer and native audio diagnostic (no screenshots or private audio in CI)
        run: cmake --build build-ui --target SkellPresetUIRenderer SkellPresetAlchemistRender --parallel 2
      - name: Prepare native executable for local Quick4
        run: |
          set -euo pipefail
          mkdir -p build-output
          renderer=$(find build-ui -type f -name SkellPresetUIRenderer -executable | head -n 1)
          test -n "$renderer"
          cp "$renderer" build-output/SkellPresetUIRenderer
          chmod +x build-output/SkellPresetUIRenderer
          diagnostic=$(find build-ui -type f -name SkellPresetAlchemistRender -executable | head -n 1)
          test -n "$diagnostic"
          cp "$diagnostic" build-output/SkellPresetAlchemistRender
          chmod +x build-output/SkellPresetAlchemistRender
          ldd build-output/SkellPresetUIRenderer | tee build-output/ldd.txt
          ldd build-output/SkellPresetAlchemistRender | tee build-output/audio-ldd.txt
          echo "source commit: $GITHUB_SHA" > build-output/provenance.txt
      - name: Upload executable for Quick4 capture and native A/B rendering
        uses: actions/upload-artifact@v4
        with:
          name: SkellPreset-Quick4-LinuxRenderer-Only
          path: build-output/
          if-no-files-found: error
          retention-days: 10
