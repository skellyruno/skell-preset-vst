name: Skell Preset Quick4 isolated real editor capture
on:
  push:
    branches:
      - ci/skell-preset-quick4-20261115
permissions:
  contents: read
concurrency:
  group: quick4-pr41-20261115
  cancel-in-progress: true
jobs:
  quick4:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install JUCE headless renderer build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build xvfb xauth pkg-config libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxext-dev libxinerama-dev libxcursor-dev libxrandr-dev libxcomposite-dev libxrender-dev libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev libgtk-3-dev
      - name: Configure exact PR41 JUCE renderer
        run: cmake -S . -B build-ui -G Ninja -DCMAKE_BUILD_TYPE=Release -DSKELL_PRESET_BUILD_UI_RENDERER=ON -DSKELL_PRESET_ALCHEMIST_RENDERER=OFF -DSKELL_PRESET_PACKAGE_TESTS=OFF -DSKELL_PRESET_HOST_TESTS=OFF
      - name: Build native plugin editor and Quick4 renderer
        run: cmake --build build-ui --target SkellPresetUIRenderer --parallel 2
      - name: Capture and inspect file count
        shell: bash
        run: |
          set -euo pipefail
          renderer=$(find build-ui -type f -name SkellPresetUIRenderer -executable | head -n 1)
          test -n "$renderer"
          xvfb-run -a -s '-screen 0 1920x1200x24' "$renderer" --output ui-quick4 --quick4
          for f in obsidian-simple-100.png obsidian-advanced-100.png obsidian-module-picker-70.png obsidian-mic-panel-70.png contact-sheet.png; do
            test -s "ui-quick4/$f"
            file "ui-quick4/$f"
          done
          test "$(find ui-quick4 -maxdepth 1 -name '*.png' | wc -l)" -eq 5
      - name: Preserve real PNG captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SkellPreset-PR41-Quick4-RealUI
          path: ui-quick4/*.png
          if-no-files-found: warn
          retention-days: 14
