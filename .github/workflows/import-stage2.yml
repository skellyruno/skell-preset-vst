name: Legacy Stage 2 importer (retired)

# Do not re-enable the historical direct-to-main importer.
# Original source is preserved in docs/legacy-stage2-import-workflow-2026-11-22.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse obsolete direct-to-main import
        run: |
          echo "::error::Retired legacy bootstrap importer. Use a tested draft PR."
          exit 1
