name: Quick4 offline source cache
on:
  workflow_dispatch:
  push:
    branches: [feature/studio-dynamics-delay-ui-20261121]
    paths:
      - '.github/workflows/quick4-source-cache.yml'
permissions:
  contents: read
jobs:
  source-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Collect pinned source dependencies (no builds or screenshots)
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/quick4-source-cache"
          mkdir -p "$root"
          git archive HEAD | tar -x -C "$(mkdir -p "$root/plugin"; echo "$root/plugin")"
          git rev-parse HEAD > "$root/PLUGIN_COMMIT"
          fetch() {
            local url="$1" ref="$2" name="$3"
            git init -q "$root/$name"
            git -C "$root/$name" fetch --depth 1 "$url" "$ref"
            git -C "$root/$name" checkout -q --detach FETCH_HEAD
            printf '%s %s %s\n' "$name" "$ref" "$(git -C "$root/$name" rev-parse HEAD)" >> "$root/DEPENDENCIES"
            rm -rf "$root/$name/.git"
          }
          fetch https://github.com/juce-framework/JUCE.git refs/tags/8.0.12 juce
          fetch https://github.com/skellyruno/skell-vst-template.git 1f759e4f6ab08d950aaccfc2dfc0415825461ff1 core
          fetch https://github.com/skellyruno/skellcore-vst-template.git 6a2077b3275819dcc1166f8c5a4a04a5f3558caf guided
          fetch https://github.com/skellyruno/skellcore-vst-template.git c4ae09c896fa84279d3cc42f19925f97a7e5c124 presence
          fetch https://github.com/skellyruno/skellcore-vst-template.git cf2d182a1c4b1b45f97253f5e1b17dd91343aeaa adlib
          fetch https://github.com/skellyruno/skellay.git 8a0904b99dba671195f139907e09ac86a09ad5f4 skellay
          test -f "$root/juce/CMakeLists.txt"
          test -f "$root/plugin/tests/ui_renderer.cpp"
          tar -czf "$RUNNER_TEMP/quick4-source-cache.tar.gz" -C "$root" .
      - uses: actions/upload-artifact@v4
        with:
          name: Quick4-offline-source-cache
          path: ${{ runner.temp }}/quick4-source-cache.tar.gz
          compression-level: 0
          retention-days: 7
